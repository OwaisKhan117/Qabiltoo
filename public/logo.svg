<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Qabiltoo brand mark: two interlocking rings — pink for the bride, blue for the groom -->
  <defs>
    <linearGradient id="qab-bride" x1="6" y1="8" x2="30" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="qab-groom" x1="20" y1="10" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5fe"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
  </defs>
  <circle cx="18.5" cy="24" r="12.5" stroke="url(#qab-bride)" stroke-width="4.5"/>
  <circle cx="29.5" cy="24" r="12.5" stroke="url(#qab-groom)" stroke-width="4.5"/>
</svg>
