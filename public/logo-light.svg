<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <!-- Qabiltoo logo — for LIGHT backgrounds (transparent, emerald wordmark) -->
  <defs>
    <linearGradient id="qab-bride" x1="14" y1="26" x2="74" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="qab-groom" x1="52" y1="30" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ec5fe"/>
      <stop offset="1" stop-color="#5b8def"/>
    </linearGradient>
    <linearGradient id="qab-gem" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f7fd"/>
      <stop offset="1" stop-color="#dfe9f6"/>
    </linearGradient>
  </defs>
  <!-- mark: two interlocking diamond rings -->
  <circle cx="46" cy="72" r="33" stroke="url(#qab-bride)" stroke-width="12"/>
  <circle cx="76" cy="72" r="33" stroke="url(#qab-groom)" stroke-width="12"/>
  <g transform="translate(41 24) rotate(-8)">
    <path d="M -8 -11 L 8 -11 L 15 -4 L 0 11 L -15 -4 Z" fill="url(#qab-gem)" stroke="#b7c4d8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -15 -4 L 15 -4 M -8 -11 L 0 11 L 8 -11" fill="none" stroke="#9fb0c7" stroke-width="1.3" stroke-linejoin="round" opacity="0.55"/>
  </g>
  <g transform="translate(81 24) rotate(8)">
    <path d="M -8 -11 L 8 -11 L 15 -4 L 0 11 L -15 -4 Z" fill="url(#qab-gem)" stroke="#b7c4d8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -15 -4 L 15 -4 M -8 -11 L 0 11 L 8 -11" fill="none" stroke="#9fb0c7" stroke-width="1.3" stroke-linejoin="round" opacity="0.55"/>
  </g>
  <!-- wordmark: the two "o" letters ARE the diamond rings -->
  <text x="132" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="bold" letter-spacing="-2" fill="#0B5345">Qabilt</text>
  <circle cx="516" cy="76" r="30" stroke="url(#qab-bride)" stroke-width="12"/>
  <circle cx="556" cy="76" r="30" stroke="url(#qab-groom)" stroke-width="12"/>
  <g transform="translate(511.5 32) rotate(-8)">
    <path d="M -7.5 -10 L 7.5 -10 L 14 -3.5 L 0 10 L -14 -3.5 Z" fill="url(#qab-gem)" stroke="#b7c4d8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -14 -3.5 L 14 -3.5 M -7.5 -10 L 0 10 L 7.5 -10" fill="none" stroke="#9fb0c7" stroke-width="1.3" stroke-linejoin="round" opacity="0.55"/>
  </g>
  <g transform="translate(560.5 32) rotate(8)">
    <path d="M -7.5 -10 L 7.5 -10 L 14 -3.5 L 0 10 L -14 -3.5 Z" fill="url(#qab-gem)" stroke="#b7c4d8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M -14 -3.5 L 14 -3.5 M -7.5 -10 L 0 10 L 7.5 -10" fill="none" stroke="#9fb0c7" stroke-width="1.3" stroke-linejoin="round" opacity="0.55"/>
  </g>
</svg>
